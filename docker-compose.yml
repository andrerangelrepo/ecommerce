services:
  api:
    build:
      context: .
      dockerfile: Dockerfile

    ports:
      - "8080:8080"

    environment:
      ASPNETCORE_ENVIRONMENT: Development
      ConnectionStrings__Database: "Data Source=/app/data/orders.db"
      Jwt__Key: "development-only-key-change-in-production"

    volumes:
      - order-data:/app/data

    healthcheck:
      # The aspnet runtime image has no curl/wget, and CMD-SHELL runs through
      # /bin/sh (dash on this image, which lacks /dev/tcp) — bash is invoked
      # explicitly instead of installing packages just for this check.
      test:
        - CMD
        - bash
        - -c
        - >
          exec 3<>/dev/tcp/localhost/8080;
          printf "GET /health HTTP/1.1\r\nHost: localhost\r\nConnection: close\r\n\r\n" >&3;
          head -1 <&3 | grep -q "200 OK"
      interval: 30s
      timeout: 5s
      retries: 5

volumes:
  order-data:
